apiVersion: 1
groups:
    - orgId: 1
      name: lab5-evaluacion
      folder: lab5
      interval: 1m
      rules:
        - uid: cg24twfinivpca
          title: FC alta paciente patient01
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: influx-lab5
              model:
                intervalMs: 1000
                maxDataPoints: 43200
                query: "from(bucket: \"telemetria\")\r\n  |> range(start: -2m)\r\n  |> filter(fn: (r) => r._measurement == \"telemetry\" and r._field == \"heart_rate\")\r\n  |> drop(columns: [\"host\", \"topic\"])\r\n  |> max()"
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - B
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 120
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 1m
          annotations:
            summary: Frecuencia cardíaca por encima de 120 bpm en patient01
          labels: {}
          isPaused: false
          notification_settings:
            receiver: webhook-lab5
